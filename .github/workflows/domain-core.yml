name: Domain Core

on:
  push:
    paths:
      - "packages/domain-core/**"
      - "fixtures/cargo-calculator/**"
      - "knowledge/carrier-services/**"
      - "knowledge/country-rules/**"
      - "knowledge/gateways/**"
      - "knowledge/trade-lanes/**"
      - "knowledge/source-records/**"
      - "schemas/carrier-service.schema.json"
      - "schemas/destination-country-rule.schema.json"
      - "schemas/transport-gateway.schema.json"
      - "schemas/trade-lane.schema.json"
      - ".github/workflows/domain-core.yml"
  pull_request:
    paths:
      - "packages/domain-core/**"
      - "fixtures/cargo-calculator/**"
      - "knowledge/carrier-services/**"
      - "knowledge/country-rules/**"
      - "knowledge/gateways/**"
      - "knowledge/trade-lanes/**"
      - "knowledge/source-records/**"
      - "schemas/carrier-service.schema.json"
      - "schemas/destination-country-rule.schema.json"
      - "schemas/transport-gateway.schema.json"
      - "schemas/trade-lane.schema.json"
      - ".github/workflows/domain-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/domain-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and test
        run: npm test
